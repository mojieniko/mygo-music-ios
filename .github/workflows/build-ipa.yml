name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MyGoMusic.ipa
        run: |
          chmod +x ./build-ipa.sh
          ./build-ipa.sh

      - name: Upload MyGoMusic.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyGoMusic-iOS-IPA
          path: MyGoMusic.ipa
          if-no-files-found: error
